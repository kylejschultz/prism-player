name: Discord issue alerts

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Send issue alert
        env:
          DISCORD_ISSUES_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUES_WEBHOOK_URL }}
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          webhook = os.environ.get("DISCORD_ISSUES_WEBHOOK_URL", "")
          if not webhook:
              sys.exit("::error::Configure the DISCORD_ISSUES_WEBHOOK_URL repository secret.")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          repository = event["repository"]
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              title = "Issue alerts test"
              description = "New issues in this repository will be posted here."
              url = repository["html_url"]
          else:
              issue = event["issue"]
              title = f"#{issue['number']}: {issue['title']}"
              description = f"Opened by {issue['user']['login']}"
              url = issue["html_url"]

          payload = {
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "author": {"name": repository["full_name"]},
                  "title": title[:256],
                  "description": description,
                  "url": url,
                  "color": 5793266,
              }],
          }
          parts = urlsplit(webhook)
          query = dict(parse_qsl(parts.query))
          query["wait"] = "true"
          destination = urlunsplit(parts._replace(query=urlencode(query)))
          request = urllib.request.Request(
              destination,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "GitHub-issue-alerts/1.0"},
              method="POST",
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=20) as response:
                  if response.status != 200:
                      sys.exit(f"::error::Discord returned HTTP {response.status}.")
          except urllib.error.HTTPError as error:
              sys.exit(f"::error::Discord returned HTTP {error.code}.")
          except (urllib.error.URLError, TimeoutError):
              sys.exit("::error::Could not reach Discord; check the webhook and retry the workflow.")
          print("Discord alert delivered.")

name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Published release tag to build and announce, for example v0.1.0
        required: false
        type: string
      source_ref:
        description: Git ref to build for a manual test artifact (does not publish a release asset)
        required: false
        type: string
      announce_only:
        description: Send the Discord announcement without rebuilding release artifacts
        required: false
        default: false
        type: boolean
      platform:
        description: Build target for manual test builds
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - windows

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  macos:
    name: macOS DMG
    if: inputs.announce_only != true && (github.event_name == 'release' || inputs.platform != 'windows')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_ref || github.ref }}

      - name: Resolve artifact name
        id: artifact
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || inputs.source_ref }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            suffix="$RELEASE_TAG"
          else
            suffix="${GITHUB_REF_NAME}"
          fi
          suffix="$(echo "$suffix" | tr '/\\:*?\"<>|' '-')"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Apple notarization key
        id: apple_credentials
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          umask 077
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          export API_KEY_PATH="$api_key_path"
          node <<'NODE'
          const fs = require("fs");

          const key = Buffer.from(process.env.APPLE_API_KEY_BASE64, "base64");
          if (!key.toString("utf8").includes("-----BEGIN PRIVATE KEY-----")) {
            throw new Error("APPLE_API_KEY_BASE64 did not decode to an App Store Connect private key.");
          }
          fs.writeFileSync(process.env.API_KEY_PATH, key, { mode: 0o600 });
          NODE
          echo "api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build macOS installer
        env:
          # Tauri skips Finder's layout script on CI by default. GitHub's macOS
          # runner supports it, and the script writes our background and icon
          # positions into the DMG's Finder metadata.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          # Tauri imports the certificate into an ephemeral keychain and signs
          # the app. Notarization is performed explicitly below so the Actions
          # log always includes Apple's submission ID and current status.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: npm run tauri:build:installer

      - name: Name macOS installer for the release
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || inputs.source_ref }}
        run: |
          source_dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$source_dmg" ]]; then
            echo "::error::No macOS DMG was produced."
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" ]]; then
            suffix="$RELEASE_TAG"
          else
            suffix="${GITHUB_REF_NAME}"
          fi
          suffix="$(echo "$suffix" | tr '/\\:*?\"<>|' '-')"
          target_dmg="src-tauri/target/release/bundle/dmg/Prism-player-${suffix}.dmg"
          mv "$source_dmg" "$target_dmg"

      - name: Notarize macOS installer
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ steps.apple_credentials.outputs.api_key_path }}
        run: |
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "::error::No macOS DMG was produced."
            exit 1
          fi

          submission_json="$(xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json)"
          printf '%s\n' "$submission_json"
          submission_id="$(node -e 'let d=""; process.stdin.on("data", c => d += c).on("end", () => { const id = JSON.parse(d).id; if (!id) process.exit(1); process.stdout.write(id); })' <<< "$submission_json")"
          echo "Apple notarization submission: $submission_id"

          for attempt in {1..60}; do
            if status_json="$(xcrun notarytool info "$submission_id" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --output-format json)"; then
              status="$(node -e 'let d=""; process.stdin.on("data", c => d += c).on("end", () => process.stdout.write(JSON.parse(d).status || "unknown"))' <<< "$status_json")"
              echo "Apple notarization status (attempt $attempt/60): $status"
              if [[ "$status" == "Accepted" ]]; then
                xcrun stapler staple -v "$dmg"
                exit 0
              fi
              if [[ "$status" == "Invalid" || "$status" == "Rejected" ]]; then
                xcrun notarytool log "$submission_id" \
                  --key "$APPLE_API_KEY_PATH" \
                  --key-id "$APPLE_API_KEY_ID" \
                  --issuer "$APPLE_API_ISSUER_ID"
                exit 1
              fi
            else
              echo "::warning::Could not read Apple notarization status; retrying."
            fi
            sleep 30
          done

          echo "::error::Apple notarization did not finish within 30 minutes (submission $submission_id)."
          exit 1

      - name: Verify signed and notarized macOS installer
        env:
          APPLE_CERTIFICATE_IDENTITY: ${{ secrets.APPLE_CERTIFICATE_IDENTITY }}
        run: |
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          if ! spctl --assess --type open --verbose=4 "$dmg"; then
            # Hosted runners do not provide Finder's download-quarantine
            # context, so spctl can return "Insufficient Context" here even
            # after Apple's acceptance and a successful stapler validation.
            echo "::warning::Gatekeeper open assessment is unavailable on this hosted runner."
          fi

          mount_point="$(mktemp -d)"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT

          app="$mount_point/Prism Player.app"
          actual_identity="$(codesign -dvv "$app" 2>&1 | awk -F= '/^Authority=Developer ID Application:/ { print substr($0, 11); exit }')"
          test "$actual_identity" = "$APPLE_CERTIFICATE_IDENTITY"
          codesign --verify --deep --strict --verbose=2 "$app"
          if ! spctl --assess --type execute --verbose=4 "$app"; then
            echo "::warning::Gatekeeper execute assessment is unavailable on this hosted runner."
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: prism-player-${{ steps.artifact.outputs.suffix }}-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}

      - name: Attach DMG to GitHub release
        if: github.event_name == 'release' || inputs.ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
        run: |
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            gh release upload "$RELEASE_TAG" "$dmg" --clobber
          done

  windows:
    name: Windows installer
    if: inputs.announce_only != true && (github.event_name == 'release' || inputs.platform != 'macos')
    runs-on: windows-latest
    # Azure's federated credential is scoped to this protected GitHub
    # environment, rather than a branch or release tag.
    environment: production
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_ref || github.ref }}

      - name: Resolve artifact name
        id: artifact
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || inputs.source_ref }}
        run: |
          if ($env:RELEASE_TAG) {
            $suffix = $env:RELEASE_TAG
          } else {
            $suffix = "${{ github.ref_name }}"
          }
          $suffix = $suffix -replace '[\\/:*?"<>|]', '-'
          "suffix=$suffix" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: 2a3f5d33-4ec8-4902-9dd9-0f3c3814f44b
          tenant-id: d1beef85-a78d-461e-a423-ef8739f4ee5e
          subscription-id: 3d356ab6-6a15-40b7-b322-fed2734b2e0d

      - name: Sign Windows installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://wus2.codesigning.azure.net/
          signing-account-name: kjschultz-prism-player
          certificate-profile-name: prism-public
          files-folder: ${{ github.workspace }}\src-tauri\target\release\bundle\nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # The Azure CLI session from azure/login is the sole supported
          # credential source for this signing step.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows installer signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer was produced."
          }

          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is $($signature.Status): $($signature.StatusMessage)"
          }
          Write-Host "Signed by: $($signature.SignerCertificate.Subject)"

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v7
        with:
          name: prism-player-${{ steps.artifact.outputs.suffix }}-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}

      - name: Attach installer to GitHub release
        if: github.event_name == 'release' || inputs.ref != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
        run: |
          for installer in src-tauri/target/release/bundle/nsis/*.exe; do
            gh release upload "$RELEASE_TAG" "$installer" --clobber
          done

  announce-discord:
    name: Discord release announcement
    needs: [macos, windows]
    if: always() && (github.event_name == 'release' || inputs.ref != '') && vars.DISABLE_DISCORD_RELEASE_ANNOUNCEMENT != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Post release announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::Set the DISCORD_RELEASE_WEBHOOK_URL repository secret before publishing a release."
            exit 1
          fi

          export RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,url,body,assets)"
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook_url = os.environ["DISCORD_WEBHOOK_URL"]
          release = json.loads(os.environ["RELEASE_JSON"])

          def post(payload, components=False):
              separator = "&" if "?" in webhook_url else "?"
              url = f"{webhook_url}{separator}with_components=true" if components else webhook_url
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json", "User-Agent": "prism-player-release-bot/1.0"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      if response.status not in (200, 204):
                          raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
              except urllib.error.HTTPError as exc:
                  print(exc.read().decode("utf-8", "replace"))
                  raise

          notes = (release.get("body") or "See the GitHub release for the full notes.").strip()
          if len(notes) > 1800:
              notes = notes[:1797].rstrip() + "..."

          card_components = [
              {"type": 10, "content": f"# {release.get('name') or os.environ['RELEASE_TAG']}"},
              {"type": 14, "divider": True, "spacing": 1},
              {"type": 10, "content": notes},
              {"type": 10, "content": f"[View release and downloads]({release['url']})"},
          ]
          post({
              "username": "Prism Player Releases",
              "flags": 32768,
              "components": [{"type": 17, "accent_color": 5934141, "components": card_components}],
          }, components=True)
          PY

name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve artifact name
        id: artifact
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            suffix="${{ github.event.release.tag_name }}"
          else
            suffix="${GITHUB_REF_NAME}"
          fi
          suffix="$(echo "$suffix" | tr '/\\:*?\"<>|' '-')"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build macOS app
        run: npm run tauri:build

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: prism-player-${{ steps.artifact.outputs.suffix }}-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}

      - name: Attach DMG to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            gh release upload "${{ github.event.release.tag_name }}" "$dmg" --clobber
          done

  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v7
        with:
          name: prism-player-${{ github.event.release.tag_name || github.ref_name }}-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}

      - name: Attach installer to GitHub release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for installer in src-tauri/target/release/bundle/nsis/*.exe; do
            gh release upload "${{ github.event.release.tag_name }}" "$installer" --clobber
          done

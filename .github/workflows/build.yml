name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Published release tag to build and announce, for example v0.1.0
        required: false
        type: string
      announce_only:
        description: Send the Discord announcement without rebuilding release artifacts
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  macos:
    name: macOS DMG
    if: inputs.announce_only != true
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || github.ref }}

      - name: Resolve artifact name
        id: artifact
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            suffix="$RELEASE_TAG"
          else
            suffix="${GITHUB_REF_NAME}"
          fi
          suffix="$(echo "$suffix" | tr '/\\:*?\"<>|' '-')"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build macOS app
        run: npm run tauri:build

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: prism-player-${{ steps.artifact.outputs.suffix }}-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}

      - name: Attach DMG to GitHub release
        if: github.event_name == 'release' || inputs.ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
        run: |
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            gh release upload "$RELEASE_TAG" "$dmg" --clobber
          done

  windows:
    name: Windows installer
    if: inputs.announce_only != true
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || github.ref }}

      - name: Resolve artifact name
        id: artifact
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
        run: |
          if ($env:RELEASE_TAG) {
            $suffix = $env:RELEASE_TAG
          } else {
            $suffix = "${{ github.ref_name }}"
          }
          $suffix = $suffix -replace '[\\/:*?"<>|]', '-'
          "suffix=$suffix" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v7
        with:
          name: prism-player-${{ steps.artifact.outputs.suffix }}-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}

      - name: Attach installer to GitHub release
        if: github.event_name == 'release' || inputs.ref != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
        run: |
          for installer in src-tauri/target/release/bundle/nsis/*.exe; do
            gh release upload "$RELEASE_TAG" "$installer" --clobber
          done

  announce-discord:
    name: Discord release announcement
    needs: [macos, windows]
    if: always() && (github.event_name == 'release' || inputs.ref != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Post release announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::Set the DISCORD_RELEASE_WEBHOOK_URL repository secret before publishing a release."
            exit 1
          fi

          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,url,body)"
          release_name="$(jq -r '.name // empty' <<<"$release")"
          release_url="$(jq -r '.url' <<<"$release")"
          description="$(jq -r '.body // "Initial alpha release."' <<<"$release")"
          if (( ${#description} > 3900 )); then
            description="${description:0:3897}..."
          fi

          payload="$(jq -n \
            --arg content '<@&1536269011468419072>' \
            --arg title "${release_name:-Prism Player $RELEASE_TAG}" \
            --arg url "$release_url" \
            --arg description "$description" \
            --argjson allowed_mentions '{"parse":["roles"]}' \
            '{content: $content, allowed_mentions: $allowed_mentions, embeds: [{title: $title, url: $url, description: $description, color: 5934141, footer: {text: "Prism Player release"}}]}')"

          curl --fail --retry 3 --retry-all-errors --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"

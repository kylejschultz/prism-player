name: Release Please

on:
  push:
    branches: [release]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: release
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

[package]
name = "prism-player"
version = "0.1.0"
description = "Native desktop music player for Navidrome-compatible libraries."
authors = ["Kyle Schultz"]
edition = "2021"

[lib]
name = "prism_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
discord-rich-presence = "1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
